<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Points Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="screen-flash"></div>
  <div class="app">
    <header>
      <h1>🎲 Random Points Game</h1>
      <p class="subtitle">Il giochino dove la fortuna decide chi vince!</p>
    </header>

    <section id="setup-screen" class="screen">
      <h2>Aggiungi i giocatori</h2>
      <form id="add-player-form">
        <input type="text" id="player-name-input" placeholder="Nome giocatore" maxlength="20" autocomplete="off" required>
        <button type="submit">➕ Aggiungi</button>
      </form>
      <ul id="player-list"></ul>

      <div class="settings-row">
        <label for="total-points-input">🎯 Punti totali in palio</label>
        <input type="number" id="total-points-input" min="1" step="1" value="100">
      </div>

      <button id="play-btn" disabled>▶️ Play</button>
      <p id="setup-hint" class="hint">Aggiungi almeno 2 giocatori per iniziare</p>
    </section>

    <section id="game-screen" class="screen hidden">
      <div id="winner-banner" class="winner-banner hidden"></div>
      <div class="game-header">
        <div class="stat-box">
          <span id="points-remaining-value">100</span>
          <span class="stat-label">punti rimasti</span>
        </div>
        <div class="countdown">
          <span id="countdown-value">5</span>
          <span class="countdown-label">prossimo punto</span>
        </div>
      </div>
      <div class="controls">
        <button id="sound-btn" type="button" aria-label="Attiva/disattiva audio">🔊</button>
        <button id="pause-btn">⏸ Pausa</button>
        <button id="reset-btn">🔄 Nuova partita</button>
      </div>
      <div id="toast" class="toast hidden"></div>
      <ol id="leaderboard"></ol>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
